
syntax = "proto3";

package localgame;

service GameService {
  rpc Join (JoinRequest) returns (JoinResponse);
  rpc Leave (SessionRequest) returns (MessageResponse);
  rpc SendMessage (PlayerMessage) returns (MessageResponse);
  rpc SubmitAction (ActionRequest) returns (MessageResponse);
  rpc StreamMessages (StreamRequest) returns (stream PlayerMessage);
}

message JoinRequest {
  string player_name = 1;
}

message JoinResponse {
  bool accepted = 1;
  string message = 2;
  string session_id = 3;
}

message SessionRequest {
  string session_id = 1;
}

message PlayerMessage {
  string player_name = 1;
  string text = 2;
  int64 timestamp = 3;
  string session_id = 4;
}

message ActionRequest {
  string session_id = 1;
  string action = 2;
  string target_name = 3;
}

message MessageResponse {
  bool accepted = 1;
  string message = 2;
}

message StreamRequest {
  string session_id = 1;
}

